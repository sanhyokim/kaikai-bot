# 1時間ごとに Hyperliquid から1分足を集め、data 枝に日ごとのファイルで貯める(ボス決定 2026-10-25)。
# 続けて紙上運転の48設定で、新しく確定した足をまとめて処理し、記録を data 枝の paper/ に置く(ボス決定 2026-10-26)。
name: collect

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: data 枝を取ってくる(無ければ作る)
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git clone --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" store
          else
            mkdir store && cd store && git init -b data
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests PyYAML tzdata
      - name: 収集
        run: python -m kaikai_bot.collect --store store
      - name: 紙上運転
        run: python -m kaikai_bot.paper --store store
      - name: data 枝に保存
        if: always()
        run: |
          cd store
          git config user.name "kaikai-bot collect"
          git config user.email "actions@users.noreply.github.com"
          rm -rf paper_work work.db
          git add -A
          git commit -q -m "収集 $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin data
